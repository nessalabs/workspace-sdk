[package]
name = "boat_client"
version = "0.1.0"
edition = "2021"
description = "Async Rust SDK for the Boat API"
license = "MIT"
repository = "https://github.com/nessalabs/boat-client-rs"
homepage = "https://github.com/nessalabs/boat-client-rs"
readme = "README.md"
keywords = ["ascii", "boat", "sandbox", "cloud"]
categories = ["api-bindings", "asynchronous"]
rust-version = "1.89"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["time", "macros", "sync", "rt"] }
url = "2"
percent-encoding = "2"
fastrand = "2"
httpdate = "1"
tracing = { version = "0.1", default-features = false, features = ["std"] }
futures-core = "0.3"
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["rt"] }
base64 = "0.22"

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
wiremock = "0.6"
