name: Workspace SDK quality gate
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: scripts/quality-gate.sh

  # The OpenSSH connection against a real sshd, directly and through
  # Agent37's own tunnel and a stand-in WebSocket edge. sshd runs unprivileged,
  # so it logs in only the account running it: the tests run as `user`.
  local-sshd:
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y openssh-server openssh-client netcat-openbsd python3
      - name: Make the account the tests log in as
        run: |
          sudo useradd --create-home user
          sudo usermod -p '*' user
          sudo mkdir -p /run/sshd
      - name: Build the tests
        run: |
          binary=$(cargo test --locked --features agent37 --lib --no-run --message-format=json \
            | jq -r 'select(.profile.test == true and .target.kind == ["lib"]) | .executable')
          install -m 0755 "$binary" /tmp/workspace-sdk-tests
      - name: Run the sshd-backed tests as user
        working-directory: /tmp
        run: sudo -u user -H /tmp/workspace-sdk-tests providers::openssh --ignored --test-threads=2

  live-artifacts:
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2
      - name: Build static native live-test artifacts
        run: |
          cargo build --locked --release --no-default-features --features portability --target x86_64-unknown-linux-musl --bin workspace-supervisor
          rustc --edition=2021 --target x86_64-unknown-linux-musl -C opt-level=2 tests/support/workload.rs -o target/x86_64-unknown-linux-musl/release/boat-live-workload
          sha256sum target/x86_64-unknown-linux-musl/release/workspace-supervisor target/x86_64-unknown-linux-musl/release/boat-live-workload > target/boat-live-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: boat-live-linux-${{ github.sha }}
          if-no-files-found: error
          retention-days: 3
          path: |
            target/x86_64-unknown-linux-musl/release/workspace-supervisor
            target/x86_64-unknown-linux-musl/release/boat-live-workload
            target/boat-live-sha256.txt
